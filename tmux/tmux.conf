set -g default-terminal "tmux-256color"
set-option -g history-limit 250000
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",*:Tc"   # enables true color passthrough
set -g pane-active-border-style fg='#db4b4b'
set -g set-clipboard on
set -g mouse on
set -g status-interval 3
set -g detach-on-destroy off
set -g status-style bg=default
set -g window-style bg=default
set -g window-active-style bg=default
set-option -g update-environment "WAYLAND_DISPLAY"
unbind C-b
set -g prefix C-Space
unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind \"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z 5

set-window-option -g mode-keys vi
set -g copy-command "xclip --selection clipboard -in"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-position top

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/continuum'
set -g @plugin "niksingh710/minimal-tmux-status"

# Init TPM, keep at the bottom of the file.
run '~/.config/tmux/plugins/tpm/tpm'
