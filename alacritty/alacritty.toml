[general]
import = ["~/.config/alacritty/eva.toml"]

[env]
TERM            = "alacritty"
COLORTERM       = "truecolor"

[window]
opacity          = 0.8
decorations      = "full"
startup_mode     = "Maximized"
dynamic_title    = true

[window.padding]
x = 8
y = 8

[scrolling]
history    = 10000
multiplier = 3

[font]
size = 10

[font.normal]
family = "monospace"
style  = "Regular"

[font.bold]
family = "monospace"
style  = "Bold"

[font.italic]
family = "monospace"
style  = "Italic"

[font.bold_italic]
family = "monospace"
style  = "Bold Italic"

[bell]
animation = "EaseOutExpo"
duration  = 0
color     = "#E67D22"

[cursor]
style            = { shape = "Block", blinking = "On" }
blink_interval   = 600
unfocused_hollow = true

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = []
