# foot.ini — converted from alacritty.toml
include=~/.config/foot/eva-theme.ini

[main]
term=foot
pad=8x8
font=monospace:size=10

[environment]
COLORTERM=truecolor

[bell]
urgent=no
notify=no
visual=no

[cursor]
style=block
blink=yes
blink-rate=600

[scrollback]
lines=10000

[colors-dark]
alpha=0.8
